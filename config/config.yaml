# 服务器配置
server:
  port: 8080
  host: "0.0.0.0"
  read_timeout: 30
  write_timeout: 30

# 系统配置
system:
  check_interval: "24h"     # 检查间隔（时间间隔格式）
  max_inactive_time: "168h"      # 最大不活跃时间（时间间隔格式）
  timezone: "Asia/Shanghai"  # 时区

# 日志配置
log:
  level: "info"
  format: "text"
  output: "stdout"

# 邮件配置
email:
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  username: ""
  password: ""
  from_email: ""
  test_email: "test@example.com"
  
  # 收件人列表
  recipients:
    - email: "test@example.com"
      name: "测试用户"

# 部署配置
deployment:
  posthumous_papers_file: "./data/posthumous_papers.md"  # 遗书文件路径

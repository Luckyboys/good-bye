<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>配置管理</h1>
            <p>管理您的遗书服务和邮件设置</p>
        </header>
        
        <nav>
            <ul>
                <li><a href="/">首页</a></li>
                <li><a href="/checkin">签到</a></li>
                <li><a href="/config">配置管理</a></li>
            </ul>
        </nav>
        
        <main>
            <div class="config-container">
                <div class="tabs">
                    <button class="tab-btn active" onclick="showTab('system')">系统设置</button>
                    <button class="tab-btn" onclick="showTab('email')">邮件配置</button>
                    <button class="tab-btn" onclick="showTab('wills')">遗书管理</button>
                </div>
                
                <!-- 系统设置 -->
                <div id="system-tab" class="tab-content active">
                    <div class="card">
                        <h2>系统设置</h2>
                        <form id="system-form">
                            <div class="form-group">
                                <label for="check_interval">检查间隔（小时）:</label>
                                <input type="number" id="check_interval" name="check_interval" min="1" required>
                            </div>
                            <div class="form-group">
                                <label for="max_inactive_days">最大不活跃天数:</label>
                                <input type="number" id="max_inactive_days" name="max_inactive_days" min="1" required>
                            </div>
                            <div class="form-group">
                                <label for="enable_notification">启用通知:</label>
                                <input type="checkbox" id="enable_notification" name="enable_notification">
                            </div>
                            <div class="form-group">
                                <label for="timezone">时区:</label>
                                <select id="timezone" name="timezone">
                                    <option value="Asia/Shanghai">Asia/Shanghai</option>
                                    <option value="UTC">UTC</option>
                                    <option value="America/New_York">America/New_York</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary">保存设置</button>
                        </form>
                    </div>
                </div>
                
                <!-- 邮件配置 -->
                <div id="email-tab" class="tab-content">
                    <div class="card">
                        <h2>邮件配置</h2>
                        <form id="email-form">
                            <div class="form-group">
                                <label for="smtp_host">SMTP服务器:</label>
                                <input type="text" id="smtp_host" name="smtp_host" required>
                            </div>
                            <div class="form-group">
                                <label for="smtp_port">SMTP端口:</label>
                                <input type="number" id="smtp_port" name="smtp_port" min="1" max="65535" required>
                            </div>
                            <div class="form-group">
                                <label for="username">用户名:</label>
                                <input type="text" id="username" name="username" required>
                            </div>
                            <div class="form-group">
                                <label for="password">密码:</label>
                                <input type="password" id="password" name="password" required>
                            </div>
                            <div class="form-group">
                                <label for="from_email">发件人邮箱:</label>
                                <input type="email" id="from_email" name="from_email" required>
                            </div>
                            <div class="form-group">
                                <label for="test_email">测试邮箱:</label>
                                <input type="email" id="test_email" name="test_email" required>
                            </div>
                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary">保存配置</button>
                                <button type="button" onclick="testEmailConfig()" class="btn btn-secondary">测试配置</button>
                            </div>
                        </form>
                    </div>
                </div>
                
                <!-- 遗书管理 -->
                <div id="wills-tab" class="tab-content">
                    <div class="card">
                        <h2>遗书管理</h2>
                        <div class="actions">
                            <button onclick="showAddWillForm()" class="btn btn-primary">添加遗书</button>
                        </div>
                        <div id="wills-list">
                            <p>加载中...</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        
        <footer>
            <p>&copy; 2024 遗书服务 - 保持联系，让爱延续</p>
        </footer>
    </div>

    <!-- 添加/编辑遗书模态框 -->
    <div id="will-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close" onclick="closeWillModal()">&times;</span>
            <h2 id="will-modal-title">添加遗书</h2>
            <form id="will-form">
                <input type="hidden" id="will_id" name="will_id">
                <div class="form-group">
                    <label for="will_title">标题:</label>
                    <input type="text" id="will_title" name="will_title" required>
                </div>
                <div class="form-group">
                    <label for="will_content">内容:</label>
                    <textarea id="will_content" name="will_content" rows="10" required></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">保存</button>
                    <button type="button" onclick="closeWillModal()" class="btn btn-secondary">取消</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/config.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>生存确认服务</h1>
            <p>定期确认您的安全状态</p>
        </header>
        
        <main>
            <div class="checkin-container">
                <div class="card">
                    <h2>签到</h2>
                    <p>点击下方按钮刷新您的存活状态</p>
                    <button onclick="performCheckin()" class="btn btn-primary btn-large">立即签到</button>
                    <div id="checkin-result" class="result" style="display: none;"></div>
                </div>
                
                <div class="card">
                    <h2>签到状态</h2>
                    <div id="status-info">
                        <p>加载中...</p>
                    </div>
                </div>
                
                <div class="card">
                    <h2>邮件测试</h2>
                    <p>测试邮件服务是否正常工作</p>
                    <button onclick="sendTestEmail()" class="btn btn-secondary">发送测试邮件</button>
                    <div id="email-result" class="result" style="display: none;"></div>
                </div>
            </div>
        </main>
        
        <footer>
            <p>&copy; <span id="current-year"></span> 生存确认服务 - 定期确认您的安全状态</p>
        </footer>
    </div>

    <script src="/static/js/common.js"></script>
    <script src="/static/js/checkin.js"></script>
</body>
</html>
